<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{META_DESCRIPTION}}">
  <meta name="author" content="{{NAME}}">
  <title>{{PAGE_TITLE}}</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>SP</text></svg>">
</head>
<body>
  <!-- Generated from resume.md — run: python generate.py -->
  <div class="page-wrapper">
    <main class="resume" id="resume">
      <div class="resume-sticky-header">
        <header class="header">
          <h1 class="header-name">{{NAME}}</h1>
          <p class="header-title">{{TAGLINE}}</p>
          <div class="contact-row">
            {{CONTACT_ROW}}
          </div>
        </header>

        <nav class="tab-nav" aria-label="Resume sections">
          <div class="tab-nav-inner" role="tablist">
            <button class="tab-btn active" role="tab" id="tab-summary" aria-controls="panel-summary" aria-selected="true" type="button">Summary</button>
            <button class="tab-btn" role="tab" id="tab-competencies" aria-controls="panel-competencies" aria-selected="false" tabindex="-1" type="button">Competencies</button>
            <button class="tab-btn" role="tab" id="tab-experience" aria-controls="panel-experience" aria-selected="false" tabindex="-1" type="button">Experience</button>
            <button class="tab-btn" role="tab" id="tab-skills" aria-controls="panel-skills" aria-selected="false" tabindex="-1" type="button">Skills</button>
            <button class="tab-btn" role="tab" id="tab-domain" aria-controls="panel-domain" aria-selected="false" tabindex="-1" type="button">Domain</button>
            <button class="tab-btn" role="tab" id="tab-education" aria-controls="panel-education" aria-selected="false" tabindex="-1" type="button">Education</button>
          </div>
        </nav>
      </div>

      <div class="content">
        {{CONTENT_SECTIONS}}
      </div>
    </main>

    <div class="actions">
      <button class="btn btn-primary" onclick="window.print()" type="button">Download / Print PDF</button>
      <a class="btn btn-secondary" href="resume.md" download>Download Markdown</a>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
